name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Известные уязвимости high/critical в продакшен-зависимостях роняют сборку
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Бюджеты 3D-моделей (LOD0 ≤ 1 МБ, LOD1 ≤ 300 КБ) и атрибуция CC BY
      - run: pnpm assets:report
      - run: pnpm i18n:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Сервер для E2E запускаем сами, в фоне и с логом в файл: если им управляет Playwright,
      # на Linux он бесконечно ждёт закрытия вывода next-server после остановки
      - name: Запуск сайта для E2E
        env:
          TELEGRAM_WEBHOOK_SECRET: e2e-telegram-secret
        run: |
          nohup pnpm --filter @redcore/web start > next-server.log 2>&1 &
          for i in $(seq 90); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 2
          done
          cat next-server.log
          exit 1
      - run: pnpm e2e --project=chromium
        env:
          E2E_EXTERNAL_SERVER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            next-server.log
          retention-days: 7

  # Миграции продакшена: только после зелёной проверки и только для main.
  # Секрет DATABASE_URL_UNPOOLED — прямая (не pooled) строка ветки Neon main.
  migrate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::warning::DATABASE_URL_UNPOOLED не задан — миграции пропущены"
            exit 0
          fi
          pnpm db:migrate
